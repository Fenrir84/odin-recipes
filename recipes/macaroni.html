<body>
    <h1>Macaroni</h1>
    <img height="250px" alt="cold cereal" src="../images/macaroni.jpg">
    <h3>Description</h3>
    <p>The cheesy classic!</p>
    <h3>Ingredients</h3>
    <ul>
        <li>1/8 cup of butter</li>
        <li>2 cups of dry macaroni</li>
        <li>1 cheese powder packet</li>
        <li>1 slice colby jack cheese</li>
    </ul>
    <h3>Steps</h3>
    <ol>
        <li><strong>Boil dry macaroni</strong> until tender</li>
        <li><strong>Drain water and add butter</strong></li>
        <li><strong>Stir in powder packet</strong></li>
        <li><strong>Stir in cheese</strong></li>
    </ol>
    <a href="../index.html">Home</a>
</body>
