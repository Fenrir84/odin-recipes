<body>
    <h1>Cereal</h1>
    <img height="250px" alt="cold cereal" src="../images/cereal.jpg">
    <h3>Description</h3>
    <p>Easy and fast!</p>
    <h3>Ingredients</h3>
    <ul>
        <li>2 cups of milk</li>
        <li>2 cups of cereal</li>
        <li>1/2 chopped banana</li>
    </ul>
    <h3>Steps</h3>
    <ol>
        <li><strong>Pour cereal</strong> into the bowl</li>
        <li><strong>Add chopped banana</strong> onto dry cereal</li>
        <li><strong>Pour in milk</strong></li>
    </ol>
